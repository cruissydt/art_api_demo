<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI找書</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        /* 自訂頁面_AI找書 開始 */
        .page_find_book {
            max-width: 1200px;
            margin: 0 auto;
        }

        /*
        .page_find_book::before {
            display: block;
            content: " ";
            width: 130px;
            height: 130px;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            background: url(https://sydtfrank.github.io/koha_ds-1/v_02/uploads/doll_09.svg) 50% 50% no-repeat;
            background-size: cover;
        }
        */

        .page_find_book .header-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .page_find_book .header-section h4 {
            color: var(--color_primary);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .page_find_book .header-section p {
            font-size: 20px;
            font-weight: 500;
        }

        .page_find_book .search-form {
            margin-bottom: 24px;
        }

        .page_find_book .input-container {
            position: relative;
            margin-bottom: 12px;
        }

        .page_find_book .note-container {
            padding: 0 4px;
            margin-top: -4px;
            margin-bottom: 20px;
        }

        .page_find_book .note-container p {
            color: #333;
            font-size: 13px;
            margin: 3px 0;
            line-height: 1.4;
        }

        .page_find_book .search-textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            padding-bottom: 30px;
            font-size: 16px;
            color: #2d3748;
            background-color: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            resize: none;
            outline: none;
            transition: all 0.25s ease-in-out;
            line-height: 1.5;
            box-sizing: border-box;
        }

        .page_find_book .search-textarea:focus {
            background-color: #ffffff;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        }

        .page_find_book .search-textarea::placeholder {
            text-align: left;
            font-style: normal;
            font-size: 14px;
            font-weight: 400;
        }

        .page_find_book .char-counter {
            position: absolute;
            bottom: 12px;
            right: 16px;
            font-size: 12px;
            color: #a0aec0;
            pointer-events: none;
            user-select: none;
        }

        .page_find_book .char-counter.limit-reached {
            color: #e53e3e;
            font-weight: bold;
        }

        .page_find_book .example-container {
            margin-bottom: 24px;
        }

        .page_find_book .example-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .page_find_book .example-title {
            font-size: 13px;
            font-weight: 600;
            color: #718096;
            display: block;
        }

        .page_find_book .btn-refresh-examples {
            font-size: 13px;
            color: #3182ce;
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
            font-weight: 600;
        }

        .page_find_book .btn-refresh-examples:hover {
            background-color: #ebf8ff;
            color: #2b6cb0;
        }

        .page_find_book .example-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 38px;
        }

        .page_find_book .example-tag {
            background-color: #edf2f7;
            color: #4a5568;
            border: 1px solid #e2e8f0;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .page_find_book .example-tag:hover {
            background-color: #ebf8ff;
            color: #2b6cb0;
            border-color: #bee3f8;
        }

        .page_find_book .btn-submit {
            display: block;
            width: 100%;
            background-color: #3182ce;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-align: center;
        }

        .page_find_book .btn-submit:hover {
            background-color: #2b6cb0;
        }

        .page_find_book .btn-submit:active {
            transform: scale(0.995);
        }

        .page_find_book .btn-submit:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        .page_find_book .loader-wrapper {
            display: none;
            text-align: center;
            padding: 40px 0;
        }

        .page_find_book .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #edf2f7;
            border-left-color: #3182ce;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .page_find_book .loader-text {
            margin-top: 12px;
            color: #718096;
            font-size: 14px;
        }

        .page_find_book .error-message {
            display: none;
            background-color: #fff5f5;
            border: 1px solid #fed7d7;
            color: #c53030;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .page_find_book .results-container {
            margin-top: 32px;
            display: none;
        }

        .page_find_book .results-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .page_find_book .book-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .page_find_book .book-meta {
            margin-bottom: 12px;
        }

        .page_find_book .book-title {
            font-size: 18px;
            font-weight: 700;
            color: #1a202c;
            margin: 0 0 6px 0;
            line-height: 1.4;
        }

        .page_find_book .book-authors {
            font-size: 13px;
            color: #718096;
            margin: 0 0 4px 0;
        }

        .page_find_book .book-isbn {
            font-size: 12px;
            color: #a0aec0;
            margin: 0;
        }

        .page_find_book .book-reason {
            background-color: #f7fafc;
            border-left: 3px solid #3182ce;
            padding: 12px;
            font-size: 14px;
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 16px;
            border-radius: 0 6px 6px 0;
        }

        .page_find_book .book-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px dashed #edf2f7;
        }

        .page_find_book .reasons-title {
            font-size: 12px;
            color: #718096;
            margin: 0;
        }

        .page_find_book .reasons-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .page_find_book .btn-reason {
            background-color: #edf2f7;
            border: 1px solid #e2e8f0;
            color: #4a5568;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .page_find_book .btn-reason:hover {
            background-color: #e2e8f0;
        }

        .page_find_book .book-link {
            font-size: 14px;
            color: #3182ce;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.15s ease;
        }

        .page_find_book .book-link:hover {
            color: #2b6cb0;
            text-decoration: underline;
        }

        @media (min-width: 768px) {
            .page_find_book .results-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        /* 自訂頁面_AI找書 結束 */
    </style>
</head>

<body>

    <div class="page_find_book">
        <div class="header-section">
            <h4>讓AI為您找書</h4>
            <p>不必在茫茫書海裡迷路，讓我們幫你找到下一本心動的書。</p>
        </div>

        <div class="search-form">
            <div class="input-container">
                <textarea class="search-textarea" id="bookSearchInput" placeholder="請輸入您的情境描述..."
                    maxlength="50"></textarea>
                <div class="char-counter" id="charCounter">0/50</div>
            </div>

            <div class="note-container">
                <p>💡 保護隱私：請勿輸入個人資料、機密資訊或其他敏感內容。</p>
                <p>💡 容錯提醒：AI 語意理解偶有偏誤，書籍資訊請以實際內容為準。</p>
                <p>💡 內容來源：部分書籍資訊與內容可能來自網路資料。</p>
                <p class="test_view"></p>
            </div>

            <div class="example-container">
                <div class="example-header">
                    <span class="example-title">💡 試試看點擊以下的情境範例：</span>
                    <button type="button" class="btn-refresh-examples" id="btnRefreshExamples">🔄換一組</button>
                </div>
                <div class="example-tags" id="exampleTagsGrid">
                </div>
            </div>

            <button type="button" class="btn-submit" id="btnSubmit">AI 找書</button>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="loader-wrapper" id="loaderWrapper">
            <div class="loader"></div>
            <div class="loader-text">AI 正在書架間為您細細挑選，請稍候...</div>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="results-grid" id="resultsGrid">
            </div>
        </div>

    </div>

    <script>
        /* AI找書 開始 */

        $(document).ready(function () {
            const API_ENDPOINT = "https://artapi.zeabur.app/koha_crm/api/search";

            const $searchInput = $('#bookSearchInput');
            const $charCounter = $('#charCounter');
            const $btnSubmit = $('#btnSubmit');
            const $loaderWrapper = $('#loaderWrapper');
            const $errorMessage = $('#errorMessage');
            const $resultsContainer = $('#resultsContainer');
            const $resultsGrid = $('#resultsGrid');
            const $exampleTagsGrid = $('#exampleTagsGrid');

            // ========================================================

                "有沒有關於憂鬱症、情緒調適的書？",
                "我想找教怎麼照顧年邁父母的書",
                "有沒有講糖尿病飲食療法的書？",
                "想找瑜伽入門或伸展運動的書",
                "有沒有講兒童自閉症或亞斯伯格症的書？",
                "我想找睡眠品質改善的相關書籍",

                "我想找養成好習慣、建立自律生活的書",
                "有沒有關於情緒勒索、拒絕別人的書？",
                "我想找適合職場新鮮人看的溝通技巧書",
                "有沒有講內向者如何自信表達的書？",
                "想找阿德勒心理學相關的書",
                "有沒有討論拖延症、如何不再拖延的書？",
                "我想找講財富心態、理財心理的書",
                "有沒有關於高敏感族群的書？",
                "想找教怎麼跟難相處的人相處的書",
                "有沒有教存股的入門書？",
                "我想找ETF投資的教學書",
                "有沒有講技術分析、K線的書？",
                "想找適合小資族的理財書",
                "有沒有講品牌行銷或商業模式設計的書？",
                "我想找關於個人品牌經營、自媒體變現的書",
                "我想找培養財商觀念、學習理財思維的入門書",
                "想找講簡報技巧、如何做出打動人心簡報的書",
                "有沒有談晶片產業、半導體的書？",
                "我想找關於元宇宙、NFT的入門書",

                "有沒有教字體排版、Typography的書？",

                "有沒有介紹全民英檢中級考試的模擬試題？",
                "想找法語入門自學的教材",
                "有沒有教商用英文email怎麼寫的書？",
                "有沒有適合航空業、空服員使用的職場英語溝通書？",

                "有沒有講昆蟲、大自然觀察的兒童圖鑑？",
                "我想找介紹台灣妖怪與民間傳說的青少年小說",
                "有沒有適合國小生看的世界史漫畫？",
                "想找教小孩自我保護觀念的繪本",
                "有沒有講環保、氣候變遷的兒童讀物？",
                "我想找拼音、注音練習的兒童教材",
                "有沒有推薦近期得獎的華文小說？",
                "我想找日本推理小說，像東野圭吾那種",
                "有沒有奇幻冒險類的小說？",
                "想找講二戰歷史的紀實文學",
                "有沒有適合國高中生看的成長小說？",
                "我想找探討台灣歷史的通俗讀物",
                "有沒有講哲學入門、生活哲學的書？",
                "想找科幻小說，像三體那種硬科幻",
                "我想找阿嘉莎·克莉絲蒂的古典偵探小說",
                "我想找關於植物、園藝種植的生活書"
            ];

            // ========================================================
            // 隨機抽選並渲染範例標籤
            // ========================================================
            function renderRandomExamples() {
                // 將陣列隨機洗牌
                const shuffled = [...ALL_EXAMPLES].sort(() => 0.5 - Math.random());
                // 取前 6 筆
                const selected = shuffled.slice(0, 6);

                $exampleTagsGrid.empty();
                $.each(selected, function (index, text) {
                    const $tag = $('<div></div>')
                        .addClass('example-tag')
                        .attr('data-text', text)
                        .text(text);
                    $exampleTagsGrid.append($tag);
                });
            }

            // ========================================================
            // 渲染所有的範例標籤
            // ========================================================
            function renderAllExamples() {
                $exampleTagsGrid.empty(); // 先清空目前的標籤容器

                // 遍歷所有範例陣列並逐一產生標籤
                var temp = 0;
                $.each(ALL_EXAMPLES, function (index, text) {
                    const $tag = $('<div></div>')
                        .addClass('example-tag')
                        .attr('data-text', text)
                        .text((++temp) + " " + text);
                    $exampleTagsGrid.append($tag);
                });
            }

            // 頁面初始化載入第一組範例
            renderRandomExamples();
            //renderAllExamples();

            // 點擊「換一組」按鈕切換
            $btnRefreshExamples.on('click', function () {
                renderRandomExamples();
            });

            // 1. 即時偵測輸入字數限制與顯示
            $searchInput.on('input', function () {
                const len = $(this).val().length;
                $charCounter.text(len + '/50');

                if (len >= 50) {
                    $charCounter.addClass('limit-reached');
                } else {
                    $charCounter.removeClass('limit-reached');
                }
            });

            // 2. 點擊範例標籤自動帶入輸入框
            $exampleTagsGrid.on('click', '.example-tag', function () {
                const text = $(this).attr('data-text');
                const truncatedText = text.substring(0, 50);
                $searchInput.val(truncatedText).trigger('input').focus();
            });

            // 3. 處理搜尋送出事件
            $btnSubmit.on('click', function () {
                const queryText = $.trim($searchInput.val());

                if (!queryText) {
                    showError("請輸入您的情境描述後再進行搜尋。");
                    return;
                }

                $errorMessage.hide().text('');
                $resultsContainer.hide();
                $resultsGrid.empty();
                setLoadingState(true);

                $.ajax({
                    url: API_ENDPOINT,
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ query: queryText }),
                    timeout: 50000,
                    success: function (response) {
                        setLoadingState(false);
                        if (response && response.results && response.results.length > 0) {
                            //renderResults(response.results, response.rewrite_query);
                            renderResults(response.results, response.query);
                            //
                            var test_view = '';
                            test_view += "ising_rewrite:" + response.ising_rewrite + "<br>";
                            test_view += "ising_llm_msg:" + response.ising_llm_msg + "<br>";
                            $(".test_view").html(test_view);
                        } else {
                            showError("查無符合相關的圖書，建議更換情境描述後再試。");
                        }
                    },
                    error: function (xhr, status, error) {
                        setLoadingState(false);
                        let displayError = "搜尋時發生錯誤，請稍後再試。";

                        if (xhr.responseJSON && xhr.responseJSON.message) {
                            // 後端統一在 body 帶 error(代碼) + message(顯示文字)
                            displayError = xhr.responseJSON.message;
                            console.warn("搜尋失敗 error code:", xhr.responseJSON.error);
                        } else if (status === "timeout") {
                            displayError = "搜尋逾時，請稍後再試。";
                        } else if (xhr.status !== 0) {
                            displayError = "錯誤: HTTP " + xhr.status + " " + error;
                        }

                        showError(displayError);
                    }
                });
            });



            function setLoadingState(isLoading) {
                if (isLoading) {
                    $btnSubmit.prop('disabled', true).text('找書中...');
                    $loaderWrapper.show();
                } else {
                    $btnSubmit.prop('disabled', false).text('AI 開始找書');
                    $loaderWrapper.hide();
                }
            }

            function showError(message) {
                $errorMessage.text(message).fadeIn(200);
            }

            function renderResults(books, arg_query) {
                $resultsGrid.empty();

                console.log(arg_query);

                $.each(books, function (index, book) {
                    let scorePercent = "未知";
                    if (book.score !== undefined && !isNaN(book.score)) {
                        scorePercent = (parseFloat(book.score) * 100).toFixed(1) + "%";
                    }

                    const safeTitle = escapeHtml(book.title || "未知書名");
                    const safeAuthors = escapeHtml(book.authors || "未提供作者");
                    const safeIsbn = escapeHtml(book.isbn || "無 ISBN");
                    const summary = escapeHtml(book.summary || "目前無資料");
                    const bookUrl = "https://crm.koha.com.tw/cgi-bin/koha/opac-detail.pl?biblionumber=" + encodeURIComponent(book.id);

                    const cardHtml = `
                        <div class="book-card" data-book-id="${book.id}">
                            <div class="book-meta">
                                <h4 class="book-title" title="${safeTitle}">${safeTitle}</h4>
                            </div>
                            <div class="book-reason">
                                <p class="book-authors">作者：${safeAuthors}</p>
                                <p class="book-isbn">ISBN：${safeIsbn}</p>
                                <p>${summary}</p>
                            </div>
                            <div class="book-footer">
                                <a href="${bookUrl}" class="book-link" rel="noopener noreferrer">檢視詳細館藏 ➔</a>
                            </div>
                        </div>
                    `;
                    $resultsGrid.append(cardHtml);
                });

                $resultsContainer.fadeIn(300);
            }

            function escapeHtml(string) {
                return String(string).replace(/[&<>"']/g, function (s) {
                    const entityMap = {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    };
                    return entityMap[s];
                });
            }
        });
        /* AI找書 結束 */
    </script>
</body>

</html>
