    <style>

            margin: 0 auto;
        }

        .page_find_book .header-section {
            text-align: center;
            margin-bottom: 50px;
        }

            color: var(--color_primary);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .page_find_book .header-section p {
            font-size: 20px;
            font-weight: 500;
        }

        .page_find_book .search-form {
            margin-bottom: 24px;
        }

        .page_find_book .input-container {
            position: relative;
            margin-bottom: 12px;
        }

        .page_find_book .note-container {
            padding: 0 4px;
            margin-top: -4px;
            margin-bottom: 20px;
        }

        .page_find_book .note-container p {
            color: #333;
            font-size: 13px;
            margin: 3px 0;
            line-height: 1.4;
        }

        .page_find_book .search-textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            padding-bottom: 30px;
            font-size: 16px;
            color: #2d3748;
            background-color: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            resize: none;
            outline: none;
            transition: all 0.25s ease-in-out;
            line-height: 1.5;
            box-sizing: border-box;
        }

        .page_find_book .search-textarea:focus {
            background-color: #ffffff;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        }

        .page_find_book .search-textarea::placeholder {
            text-align: left;
            font-style: normal;
            font-size: 14px;
            font-weight: 400;
        }

        .page_find_book .char-counter {
            position: absolute;
            bottom: 12px;
            right: 16px;
            font-size: 12px;
            color: #a0aec0;
            pointer-events: none;
            user-select: none;
        }

        .page_find_book .char-counter.limit-reached {
            color: #e53e3e;
            font-weight: bold;
        }

        .page_find_book .example-container {
            margin-bottom: 24px;
        }

        .page_find_book .example-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .page_find_book .example-title {
            font-size: 13px;
            font-weight: 600;
            color: #718096;
            display: block;
        }

        .page_find_book .btn-refresh-examples {
            font-size: 13px;
            color: #3182ce;
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
            font-weight: 600;
        }

        .page_find_book .btn-refresh-examples:hover {
            background-color: #ebf8ff;
            color: #2b6cb0;
        }

        .page_find_book .example-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 38px;
        }

        .page_find_book .example-tag {
            background-color: #edf2f7;
            color: #4a5568;
            border: 1px solid #e2e8f0;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .page_find_book .example-tag:hover {
            background-color: #ebf8ff;
            color: #2b6cb0;
            border-color: #bee3f8;
        }

        .page_find_book .btn-submit {
            display: block;
            width: 100%;
            background-color: #3182ce;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-align: center;
        }

        .page_find_book .btn-submit:hover {
            background-color: #2b6cb0;
        }

        .page_find_book .btn-submit:active {
            transform: scale(0.995);
        }

        .page_find_book .btn-submit:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        .page_find_book .loader-wrapper {
            display: none;
            text-align: center;
            padding: 40px 0;
        }

        .page_find_book .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #edf2f7;
            border-left-color: #3182ce;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .page_find_book .loader-text {
            margin-top: 12px;
            color: #718096;
            font-size: 14px;
        }

        .page_find_book .error-message {
            display: none;
            background-color: #fff5f5;
            border: 1px solid #fed7d7;
            color: #c53030;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .page_find_book .results-container {
            margin-top: 32px;
            display: none;
        }

        .page_find_book .results-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .page_find_book .book-card {

            border-radius: 10px;

            justify-content: space-between;

            font-weight: 700;
            color: #1a202c;
            margin: 0 0 6px 0;
            line-height: 1.4;
        }

        .page_find_book .book-authors {

            color: #718096;
            margin: 0 0 4px 0;
        }

        .page_find_book .book-isbn {

            color: #a0aec0;
            margin: 0;
        }

        .page_find_book .book-reason {
            background-color: #f7fafc;
            border-left: 3px solid #3182ce;
            padding: 12px;
            font-size: 14px;
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 16px;
            border-radius: 0 6px 6px 0;
        }

        .page_find_book .book-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px dashed #edf2f7;
        }

        .page_find_book .reasons-title {
            font-size: 12px;
            color: #718096;
            margin: 0;
        }

        .page_find_book .reasons-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .page_find_book .btn-reason {
            background-color: #edf2f7;
            border: 1px solid #e2e8f0;
            color: #4a5568;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .page_find_book .btn-reason:hover {
            background-color: #e2e8f0;
        }

        .page_find_book .book-link {
            font-size: 14px;
            color: #3182ce;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.15s ease;
        }

        .page_find_book .book-link:hover {
            color: #2b6cb0;
            text-decoration: underline;
        }

        .page_find_book .feedback-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #edf2f7;
        }

        .page_find_book .feedback-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-start;
        }

        .page_find_book .feedback-btn {
            padding: 4px 12px;
            border: 1px solid #e2e8f0;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;

        .page_find_book .feedback-btn:hover {

        }

        .page_find_book .like-btn:hover {

        }

        .page_find_book .dislike-btn:hover {

            border-color: #dc2626;
        }

        .page_find_book .dislike-form {
            display: none;
            margin-top: 8px;
            font-size: 13px;
            background: #f7fafc;
            padding: 10px 12px;
            border-radius: 6px;
        }

            margin: 0 0 8px 0;
            font-weight: bold;
            font-size: 13px;
        }

        .page_find_book .dislike-form label {
            display: block;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .page_find_book .dislike-form label input {
            appearance: auto;
            height: auto;
        }

        .page_find_book input[type="text"].other-input {
            width: 100%;
            padding: 6px 8px;
            margin-top: 4px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            box-sizing: border-box;
            display: none;
            outline: none;
            font-size: 13px;
        }

        .page_find_book .other-input:focus {
            border-color: #3182ce;
        }

        .page_find_book .submit-dislike-btn {
            margin-top: 8px;
            padding: 6px 12px;
            background: #6b7280;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .page_find_book .feedback-msg {
            color: #059669;
            font-weight: bold;
            text-align: left;
            font-size: 13px;
            display: none;
            margin-top: 5px;
        }

        @media (min-width: 768px) {
            .page_find_book .results-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        /* 自訂頁面_AI找書 結束 */
    </style>
</head>

<body>


    <!-- AI找書 開始 -->
    <div class="page_find_book">
        <div class="header-section">
            <h4>讓AI為您找書</h4>
            <p>不必在茫茫書海裡迷路，讓我們幫你找到下一本心動的書。</p>
        </div>

        <div class="search-form">
            <div class="input-container">
                <textarea class="search-textarea" id="bookSearchInput" placeholder="請輸入您的情境描述..."
                    maxlength="50"></textarea>
                <div class="char-counter" id="charCounter">0/50</div>
            </div>

            <div class="note-container">
                <p>💡 保護隱私：請勿輸入個人資料、機密資訊或其他敏感內容。</p>
                <p>💡 容錯提醒：AI 語意理解偶有偏誤，書籍資訊請以實際內容為準。</p>
                <p>💡 內容來源：部分書籍資訊與內容可能來自網路資料。</p>
                <p class="test_view"></p>
            </div>

            <div class="example-container">
                <div class="example-header">
                    <span class="example-title">💡 試試看點擊以下的情境範例：</span>
                    <button type="button" class="btn-refresh-examples" id="btnRefreshExamples">🔄換一組</button>
                </div>
                <div class="example-tags" id="exampleTagsGrid">情境範例，正在載入中...</div>
            </div>

            <button type="button" class="btn-submit" id="btnSubmit">AI 找書</button>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="loader-wrapper" id="loaderWrapper">
            <div class="loader"></div>
            <div class="loader-text">AI 正在書架間為您細細挑選，請稍候...</div>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="results-grid" id="resultsGrid">
            </div>
        </div>
    </div>
    <!-- AI找書 結束 -->

            function getRandomExamples(count) {
                let shuffled = rawExamples.slice(0), i = rawExamples.length, min = i - count, temp, index;
                while (i-- > min) {
                    index = Math.floor((i + 1) * Math.random());
                    temp = shuffled[index];
                    shuffled[index] = shuffled[i];
                    shuffled[i] = temp;
                }
                return shuffled.slice(min);
                //全部顯示
                //return rawExamples.slice();
            }

            function renderRandomExamples() {
                const selected = getRandomExamples(6);

                $exampleTagsGrid.empty();
                $.each(selected, function (index, text) {
                    const $tag = $('<div></div>')
                        .addClass('example-tag')
                        .attr('data-text', text)
                        .text(text);
                    $exampleTagsGrid.append($tag);
                });
            }

            renderRandomExamples();


            // 點擊「換一組」按鈕切換
            $btnRefreshExamples.on('click', function () {
                renderRandomExamples();
            });

            // 1. 即時偵測輸入字數限制與顯示
            $searchInput.on('input', function () {
                const len = $(this).val().length;
                $charCounter.text(len + '/50');

                if (len >= 50) {
                    $charCounter.addClass('limit-reached');
                } else {
                    $charCounter.removeClass('limit-reached');
                }
            });

            // 2. 點擊範例標籤自動帶入輸入框
            $exampleTagsGrid.on('click', '.example-tag', function () {
                const text = $(this).attr('data-text');
                const truncatedText = text.substring(0, 50);
                $searchInput.val(truncatedText).trigger('input').focus();
            });

            // 3. 處理搜尋送出事件
            $btnSubmit.on('click', function () {
                const queryText = $.trim($searchInput.val());

                if (!queryText) {
                    showError("請輸入您的情境描述後再進行搜尋。");
                    return;
                }

                $errorMessage.hide().text('');
                $resultsContainer.hide();
                $resultsGrid.empty();
                setLoadingState(true);

                $.ajax({
                    url: API_ENDPOINT,
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ query: queryText }),
                    timeout: 50000,
                    success: function (response) {
                        setLoadingState(false);
                        if (response && response.results && response.results.length > 0) {
                            renderResults(response.results, response.query);
                            //
                            var test_view = '';
                            $(".test_view").html(test_view);
                        } else {
                            showError("查無符合相關的圖書，建議更換情境描述後再試。");
                        }
                    },
                    error: function (xhr, status, error) {
                        setLoadingState(false);
                        let displayError = "搜尋時發生錯誤，請稍後再試。";

                        if (xhr.responseJSON && xhr.responseJSON.message) {
                            // 後端統一在 body 帶 error(代碼) + message(顯示文字)
                            displayError = xhr.responseJSON.message;
                            console.warn("搜尋失敗 error code:", xhr.responseJSON.error);
                        } else if (status === "timeout") {
                            displayError = "搜尋逾時，請稍後再試。";
                        } else if (xhr.status !== 0) {
                            displayError = "錯誤: HTTP " + xhr.status + " " + error;
                        }

                        showError(displayError);
                    }
                });
            });



            function setLoadingState(isLoading) {
                if (isLoading) {
                    $btnSubmit.prop('disabled', true).text('找書中...');
                    $loaderWrapper.show();
                } else {
                    $btnSubmit.prop('disabled', false).text('AI 開始找書');
                    $loaderWrapper.hide();
                }
            }

            function showError(message) {
                $errorMessage.text(message).fadeIn(200);
            }

            function renderResults(books, arg_query) {
                $resultsGrid.empty();

                console.log(arg_query);

                $.each(books, function (index, book) {
                    let scorePercent = "未知";
                    if (book.score !== undefined && !isNaN(book.score)) {
                        scorePercent = (parseFloat(book.score) * 100).toFixed(1) + "%";
                    }

                    const safeTitle = escapeHtml(book.title || "未知書名");
                    const safeAuthors = escapeHtml(book.authors || "未提供作者");
                    const safeIsbn = escapeHtml(book.isbn || "無 ISBN");
                    const summary = escapeHtml(book.summary || "目前無資料");
                    const bookUrl = "https://crm.koha.com.tw/cgi-bin/koha/opac-detail.pl?biblionumber=" + encodeURIComponent(book.id);
                    const safeQuery = escapeHtml(arg_query || "");

                    const cardHtml = `
                        <div class="book-card" data-book-id="${book.id}" data-book-title="${safeTitle}" data-query="${safeQuery}">
                            <div class="book-meta">
                                <h4 class="book-title" title="${safeTitle}">${safeTitle}</h4>
                            </div>
                            <div class="book-reason">
                                <p class="book-authors">作者：${safeAuthors}</p>
                                <p class="book-isbn">ISBN：${safeIsbn}</p>
                                <p>${summary}</p>
                            </div>
                            <div class="book-footer">
                                <a href="${bookUrl}" class="book-link" rel="noopener noreferrer">檢視詳細館藏 ➔</a>
                            </div>
                            <div class="feedback-section">
                                <div class="feedback-buttons">
                                    <button class="feedback-btn like-btn">喜歡</button>
                                    <button class="feedback-btn dislike-btn">不喜歡</button>
                                </div>

                                <div class="dislike-form">
                                    <p>請告訴我們原因：</p>
                                    <label><input type="radio" name="reason-${book.id}" value="不符合情境" class="reason-radio"> 不符合情境</label>
                                    <label><input type="radio" name="reason-${book.id}" value="與書單資訊不符" class="reason-radio"> 與書單資訊不符</label>
                                    <label><input type="radio" name="reason-${book.id}" value="用錯語言" class="reason-radio"> 用錯語言</label>
                                    <label><input type="radio" name="reason-${book.id}" value="其他" class="reason-radio"> 其他</label>
                                    <input type="text" class="other-input" maxlength="30" placeholder="請輸入其他原因...(限 30 字)">
                                    <button class="submit-dislike-btn">送出回饋</button>
                                </div>

                                <div class="feedback-msg">謝謝您的回饋！</div>
                            </div>
                        </div>
                    `;
                    $resultsGrid.append(cardHtml);
                });

                $resultsContainer.fadeIn(300);
            }

            // ========================================================
            // 意見回饋：將喜歡／不喜歡送到 Google 試算表（透過 GAS doPost）
            // ========================================================
            function sendFeedbackToSheet(card, feedbackType, reason = "", otherReason = "") {
                const payload = {
                    timestamp: new Date().toLocaleString('zh-TW', { hour12: false }),
                    bookId: card.data('book-id'),
                    bookTitle: card.data('book-title'),
                    queryContext: card.data('query'),
                    feedbackType: feedbackType,
                    reason: reason,
                    otherReason: otherReason
                };

                fetch(GOOGLE_SHEET_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(err => console.error("傳送回饋失敗:", err));
            }

            $(document).on('click', '.like-btn', function () {
                const card = $(this).closest('.book-card');
                const section = $(this).closest('.feedback-section');

                sendFeedbackToSheet(card, '喜歡');
                section.find('.feedback-buttons').hide();
                section.find('.dislike-form').hide();
                section.find('.feedback-msg').fadeIn();
            });

            $(document).on('click', '.dislike-btn', function () {
                const section = $(this).closest('.feedback-section');
                section.find('.feedback-buttons').hide();
                section.find('.dislike-form').fadeIn();
            });

            $(document).on('change', '.reason-radio', function () {
                const form = $(this).closest('.dislike-form');
                if ($(this).val() === '其他') {
                    form.find('.other-input').slideDown();
                } else {
                    form.find('.other-input').slideUp();
                }
            });

            $(document).on('click', '.submit-dislike-btn', function () {
                const card = $(this).closest('.book-card');
                const section = $(this).closest('.feedback-section');
                const form = section.find('.dislike-form');

                const selectedReason = form.find('.reason-radio:checked').val();
                if (!selectedReason) {
                    alert('請選擇一個原因！');
                    return;
                }

                const otherReasonText = selectedReason === '其他' ? form.find('.other-input').val().trim() : "";
                if (selectedReason === '其他' && !otherReasonText) {
                    alert('請輸入其他原因！');
                    return;
                }

                sendFeedbackToSheet(card, '不喜歡', selectedReason, otherReasonText);
                form.hide();
                section.find('.feedback-msg').fadeIn();
            });

            function escapeHtml(string) {
                return String(string).replace(/[&<>"']/g, function (s) {
                    const entityMap = {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    };
                    return entityMap[s];
                });
            }
        });
        /* AI找書 結束 */
    </script>
</body>

</html>
