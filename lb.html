<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 找書</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            "Noto Sans TC",
            "Microsoft JhengHei",
            sans-serif;
        color: #263238;
        background: #f4f8f8;
        line-height: 1.7;
    }

    .container {
        width: min(1100px, calc(100% - 40px));
        margin: 0 auto;
    }

    /* Header */
    .hero {
        padding: 60px 0 40px;
        text-align: center;
    }

    .hero-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e1f3f1;
        color: #168b84;
        font-size: 30px;
    }

    .hero h1 {
        margin: 0 0 10px;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: .02em;
        color: #183c3a;
    }

    .hero p {
        margin: 0;
        color: #687878;
        font-size: 16px;
    }

    /* Search */
    .search-box {
        background: #fff;
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 8px 30px rgba(31, 72, 70, .08);
        border: 1px solid #e2eeee;
    }

    .input-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }

    .input-title {
        font-size: 17px;
        font-weight: 700;
        color: #294746;
    }

    .counter {
        color: #849494;
        font-size: 14px;
    }

    .counter.warning {
        color: #d77b37;
    }

    #query {
        width: 100%;
        min-height: 100px;
        resize: vertical;
        border: 1px solid #cbdcdb;
        border-radius: 12px;
        padding: 15px 16px;
        font: inherit;
        font-size: 16px;
        color: #263b3a;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
    }

    #query:focus {
        border-color: #2ca69e;
        box-shadow: 0 0 0 4px rgba(44, 166, 158, .12);
    }

    .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 18px;
    }

    .btn {
        border: 0;
        border-radius: 10px;
        padding: 11px 20px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: .2s;
    }

    .btn:disabled {
        cursor: not-allowed;
        opacity: .55;
    }

    .btn-random {
        background: #eef5f4;
        color: #37706d;
    }

    .btn-random:hover:not(:disabled) {
        background: #e0eeec;
    }

    .btn-search {
        min-width: 130px;
        background: #168f87;
        color: #fff;
    }

    .btn-search:hover:not(:disabled) {
        background: #117a74;
    }

    /* Examples */
    .examples {
        margin-top: 22px;
    }

    .examples-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }

    .examples-title strong {
        font-size: 15px;
        color: #526967;
    }

    .example-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }

    .example-item {
        padding: 11px 13px;
        border-radius: 10px;
        background: #f5f9f8;
        border: 1px solid #e1ebea;
        color: #49615f;
        font-size: 14px;
        cursor: pointer;
        transition: .2s;
    }

    .example-item:hover {
        background: #e6f4f2;
        border-color: #b9ddda;
        color: #167d77;
    }

    /* Loading */
    .loading {
        display: none;
        text-align: center;
        padding: 40px 0 20px;
    }

    .spinner {
        width: 38px;
        height: 38px;
        margin: 0 auto 12px;
        border: 4px solid #dcebea;
        border-top-color: #168f87;
        border-radius: 50%;
        animation: spin .8s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .loading-text {
        color: #6d7f7d;
        font-size: 14px;
    }

    /* Results */
    .results-section {
        margin: 42px 0 60px;
    }

    .results-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 18px;
    }

    .results-header h2 {
        margin: 0;
        font-size: 22px;
        color: #254543;
    }

    .result-count {
        color: #82918f;
        font-size: 14px;
    }

    .book-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
    }

    .book-card {
        background: #fff;
        border: 1px solid #e1eceb;
        border-radius: 16px;
        padding: 22px;
        box-shadow: 0 5px 20px rgba(30, 70, 68, .05);
        display: flex;
        flex-direction: column;
    }

    .book-title {
        margin: 0 0 14px;
        font-size: 19px;
        line-height: 1.5;
        color: #1f4643;
    }

    .book-meta {
        margin-bottom: 12px;
        color: #637572;
        font-size: 14px;
    }

    .book-meta div {
        margin-bottom: 4px;
    }

    .meta-label {
        display: inline-block;
        width: 48px;
        color: #849491;
    }

    .book-summary {
        margin: 8px 0 18px;
        color: #536562;
        font-size: 14px;
        flex: 1;
    }

    .book-link {
        display: inline-block;
        align-self: flex-start;
        padding: 8px 14px;
        border-radius: 8px;
        background: #edf7f5;
        color: #157c76;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
    }

    .book-link:hover {
        background: #dcefeb;
    }

    /* Message */
    .message {
        display: none;
        margin-top: 25px;
        padding: 15px 18px;
        border-radius: 10px;
        font-size: 14px;
    }

    .message.error {
        background: #fff1ef;
        color: #b64b3f;
        border: 1px solid #f2d0cb;
    }

    .empty {
        text-align: center;
        padding: 45px 20px;
        color: #899694;
        background: #fff;
        border-radius: 15px;
        border: 1px solid #e5eeee;
    }

    /* Footer */
    footer {
        text-align: center;
        padding: 25px 0 40px;
        color: #91a09e;
        font-size: 13px;
    }

    @media (max-width: 760px) {
        .container {
            width: min(100% - 24px, 600px);
        }

        .hero {
            padding: 40px 0 28px;
        }

        .hero h1 {
            font-size: 30px;
        }

        .search-box {
            padding: 20px;
        }

        .example-list,
        .book-list {
            grid-template-columns: 1fr;
        }

        .actions {
            flex-direction: column-reverse;
            align-items: stretch;
        }

        .btn {
            width: 100%;
        }
    }
</style>

</head>

    /*
     * 取得 6 個不重複的隨機情境
     */
    function getRandomExamples() {

        var shuffled = examples.slice();

        for (var i = shuffled.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = shuffled[i];
            shuffled[i] = shuffled[j];
            shuffled[j] = temp;
        }

        return shuffled.slice(0, 6);
    }

    /*
     * 顯示情境
     */
    function renderExamples() {

        var list = getRandomExamples();

        $("#exampleList").empty();

        $.each(list, function (index, text) {

            var item = $("<div>")
                .addClass("example-item")
                .text(text)
                .attr("role", "button")
                .attr("tabindex", "0");

            item.on("click", function () {
                $("#query").val(text).trigger("input").focus();
            });

            item.on("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    $("#query").val(text).trigger("input").focus();
                }
            });

            $("#exampleList").append(item);
        });
    }

    /*
     * 更新字數
     */
    function updateCounter() {

        var length = $("#query").val().length;

        $("#charCount").text(length);

        if (length >= 45) {
            $(".counter").addClass("warning");
        } else {
            $(".counter").removeClass("warning");
        }
    }

    /*
     * 顯示錯誤
     */
    function showError(message) {

        $("#errorMessage")
            .text(message)
            .stop(true, true)
            .fadeIn(200);
    }

    /*
     * 清除錯誤
     */
    function hideError() {
        $("#errorMessage").hide().text("");
    }

    /*
     * Loading
     */
    function setLoading(isLoading) {

        if (isLoading) {

            $("#loading").stop(true, true).fadeIn(150);

            $("#searchBtn")
                .prop("disabled", true)
                .text("搜尋中…");

            $("#randomBtn").prop("disabled", true);

        } else {

            $("#loading").stop(true, true).fadeOut(150);

            $("#searchBtn")
                .prop("disabled", false)
                .text("AI 找書");

            $("#randomBtn").prop("disabled", false);
        }
    }

    /*
     * 顯示搜尋結果
     */
    function renderResults(results) {

        $("#bookList").empty();

        if (!results || results.length === 0) {

            $("#resultCount").text("");

            $("#bookList").html(
                '<div class="empty">目前沒有找到符合條件的書籍。</div>'
            );

            $("#resultsSection").fadeIn(200);

            return;
        }

        $("#resultCount").text("找到 " + results.length + " 本");

        $.each(results, function (index, book) {

            var title = book.title || "未提供書名";
            var authors = book.authors || "未提供作者";
            var isbn = book.isbn || "未提供 ISBN";
            var summary = book.summary || "暫無摘要";
            var bookId = book.id || "";

            var detailUrl =
                "https://lb30.libraryandbook.net/Book_detial/" +
                encodeURIComponent(bookId);

            var card = $("<article>").addClass("book-card");

            $("<h3>")
                .addClass("book-title")
                .text(title)
                .appendTo(card);

            var meta = $("<div>")
                .addClass("book-meta");

            $("<div>")
                .html(
                    '<span class="meta-label">作者</span>' +
                    $('<span>').text(authors).prop("outerHTML")
                )
                .appendTo(meta);

            $("<div>")
                .html(
                    '<span class="meta-label">ISBN</span>' +
                    $('<span>').text(isbn).prop("outerHTML")
                )
                .appendTo(meta);

            meta.appendTo(card);

            $("<div>")
                .addClass("book-summary")
                .text(summary)
                .appendTo(card);

            $("<a>")
                .addClass("book-link")
                .attr("href", detailUrl)
                .attr("target", "_blank")
                .attr("rel", "noopener noreferrer")
                .text("檢視詳細館藏 →")
                .appendTo(card);

            $("#bookList").append(card);
        });

        $("#resultsSection").fadeIn(200);
    }

    /*
     * 執行搜尋
     */
    function searchBooks() {

        hideError();

        var query = $("#query").val().trim();

        if (!query) {
            showError("請先輸入你想找的書籍內容。");
            $("#query").focus();
            return;
        }

        if (query.length > 50) {
            showError("搜尋內容不能超過 50 個字。");
            $("#query").focus();
            return;
        }

        setLoading(true);

        $.ajax({
            url: API_URL,
            method: "POST",
            contentType: "application/json",
            dataType: "json",
            data: JSON.stringify({
                query: query
            }),

            success: function (response) {

                if (response && response.results) {
                    renderResults(response.results);
                } else {
                    renderResults([]);
                }
            },

            error: function (xhr) {

                var message = "搜尋失敗，請稍後再試。";

                if (xhr.responseJSON) {

                    if (xhr.responseJSON.message) {
                        message = xhr.responseJSON.message;
                    } else if (xhr.responseJSON.error) {
                        message = xhr.responseJSON.error;
                    }
                }

                if (xhr.status === 429) {
                    message = "搜尋次數過於頻繁，請稍後再試。";
                }

                if (xhr.status === 413) {
                    message = "搜尋內容不能超過 50 個字。";
                }

                showError(message);
            },

            complete: function () {
                setLoading(false);
            }
        });
    }

    /*
     * 事件
     */
    $("#query").on("input", function () {

        var value = $(this).val();

        if (value.length > 50) {
            $(this).val(value.substring(0, 50));
        }

        updateCounter();
    });

    $("#randomBtn").on("click", function () {
        renderExamples();
    });

    $("#searchBtn").on("click", function () {
        searchBooks();
    });

    $("#query").on("keydown", function (e) {

        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
            searchBooks();
        }
    });

    /*
     * 初始載入
     */
    renderExamples();
    updateCounter();

});
</script>

</body>
</html>
