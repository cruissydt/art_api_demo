<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 找書小幫手</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        /* AI找書 開始 */
        .ai_find_book_box {
            max-width: 1200px;
            margin: 0 auto;
        }

        .ai_find_book_box .search-section {
            padding: 20px 0;
            border-radius: 12px;
            margin-bottom: 30px;
        }


        /* 語言列 checkbox 樣式 開始 */
        .ai_find_book_box .language-filter {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .ai_find_book_box .language-filter label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-size: 15px;
            color: #4B5563;
        }

        .ai_find_book_box .language-filter input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .ai_find_book_box .language-filter .custom-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #E5E7EB;
            border-radius: 2px;
            background-color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .ai_find_book_box .language-filter .custom-checkbox::after {
            content: "";
            width: 5px;
            height: 9px;
            border: solid #ffffff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg) scale(0);
            transition: transform 0.15s ease-in-out;
            margin-bottom: 2px;
        }

        .ai_find_book_box .language-filter label:hover .custom-checkbox {
            border-color: #44a6af;
        }

        .ai_find_book_box .language-filter input[type="checkbox"]:checked+.custom-checkbox {
            background-color: #44a6af;
            border-color: #44a6af;
        }

        .ai_find_book_box .language-filter input[type="checkbox"]:checked+.custom-checkbox::after {
            transform: rotate(45deg) scale(1);
        }

        /* 語言列 checkbox 樣式 結束 */

        .ai_find_book_box .input-group {
            position: relative;
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .ai_find_book_box .input-wrapper {
            flex-grow: 1;
            position: relative;
        }

        .ai_find_book_box input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            padding-right: 60px;
            font-size: 16px;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
            height: auto;
        }

        .ai_find_book_box input[type="text"]:focus {
            border-color: #44a6af;
        }

        .ai_find_book_box .char-count {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6B7280;
            font-size: 13px;
        }

        .ai_find_book_box button.search-btn {
            background-color: #44a6af;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .ai_find_book_box button.search-btn:hover:not(:disabled) {
            background-color: #69b2b9;
        }

        .ai_find_book_box button.search-btn:disabled {
            cursor: not-allowed;
        }


        .ai_find_book_box .examples-section {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            flex-wrap: wrap;
        }

        .ai_find_book_box .note-container {
            margin: 0 0 20px 0;
        }

        .ai_find_book_box .note-container p {
            color: #666;
            font-size: 13px;
            line-height: 1em;
        }

        .ai_find_book_box .refresh-btn {
            background: none;
            border: 1px solid #44a6af;
            color: #44a6af;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .ai_find_book_box .refresh-btn:hover {
            background: #44a6af;
            color: white;
        }

        .ai_find_book_box .tags-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            flex-grow: 1;
        }

        .ai_find_book_box .example-tag {
            background: #e2f0f1;
            color: #4480af;
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }

        .ai_find_book_box .example-tag:hover {
            color: #da640a;
        }

        .ai_find_book_box .loading-box {
            display: none;
            text-align: center;
            padding: 40px;
            color: #6B7280;
            font-size: 18px;
        }

        .ai_find_book_box .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(79, 70, 229, 0.3);
            border-radius: 50%;
            border-top-color: #44a6af;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .ai_find_book_box .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
            gap: 20px;
        }

        .ai_find_book_box .book-card {
            border: 1px solid #E5E7EB;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .ai_find_book_box .book-title,
        .ai_find_book_box .book-title a {
            font-size: 18px;
            font-weight: bold;
            color: #44a6af;
            margin: 0 0 10px 0;
            line-height: 1.4;
            text-decoration: none;
        }

        .ai_find_book_box .book-title a:hover {
            color: da640a;
        }

        .ai_find_book_box .book-meta {
            font-size: 14px;
            color: #6B7280;
            margin-bottom: 5px;
        }

        .ai_find_book_box .book-meta.score {
            display: block;
        }

        .ai_find_book_box .book-summary {
            font-size: 14px;
            margin: 15px 0;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ai_find_book_box .book-link {
            display: inline-block;
            text-align: center;
            background: #F3F4F6;
            color: #374151;
            text-decoration: none;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            margin-top: auto;
        }

        .ai_find_book_box .book-link:hover {
            background: #E5E7EB;
        }

        .ai_find_book_box .error-msg {
            color: #ff6670;
            background: #fff3f3;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
            margin-bottom: 20px;
        }


        @media (max-width: 600px) {
            .ai_find_book_box .input-group {
                flex-direction: column;
            }

            .ai_find_book_box button.search-btn {
                width: 100%;
            }
        }

        .ai_find_book_box .feedback-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #E5E7EB;
        }

        .ai_find_book_box .feedback-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-start;
        }

        .ai_find_book_box .feedback-btn {
            padding: 4px 12px;
            border: 1px solid #E5E7EB;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }

        .ai_find_book_box .feedback-btn:hover {
            background: #F3F4F6;
        }

        .ai_find_book_box .like-btn:hover {
            color: #059669;
            border-color: #059669;
        }

        .ai_find_book_box .dislike-btn:hover {
            color: #DC2626;
            border-color: #DC2626;
        }

        .ai_find_book_box .dislike-form {
            display: none;
            margin-top: 8px;
            font-size: 13px;
            background: #F9FAFB;
            padding: 10px 12px;
            border-radius: 6px;
        }

        .ai_find_book_box .dislike-form p {
            margin: 0 0 8px 0;
            font-weight: bold;
            font-size: 13px;
        }

        .ai_find_book_box .dislike-form label {
            display: block;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .ai_find_book_box .dislike-form label input {
            appearance: auto;
            height: auto;
        }

        .ai_find_book_box input[type="text"].other-input {
            width: 100%;
            padding: 6px 8px;
            margin-top: 4px;
            border: 1px solid #E5E7EB;
            border-radius: 4px;
            box-sizing: border-box;
            display: none;
            outline: none;
            font-size: 13px;
        }

        .ai_find_book_box .other-input:focus {
            border-color: #44a6af;
        }

        .ai_find_book_box .submit-dislike-btn {
            margin-top: 8px;
            padding: 6px 12px;
            background: #6B7280;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .ai_find_book_box .feedback-msg {
            color: #059669;
            font-weight: bold;
            text-align: left;
            font-size: 13px;
            display: none;
            margin-top: 5px;
        }

        /* AI找書 結束 */
    </style>
</head>

<body>

    <div class="ai_find_book_box">
        <div class="search-section">
            <div class="language-filter" id="languageFilter">
                <label>
                    <input type="checkbox" class="lang-checkbox" value="繁體中文" checked>
                    <span class="custom-checkbox"></span>
                    <span>繁體中文</span>
                </label>
                <label>
                    <input type="checkbox" class="lang-checkbox" value="簡體中文" checked>
                    <span class="custom-checkbox"></span>
                    <span>简体中文</span>
                </label>
                <label>
                    <input type="checkbox" class="lang-checkbox" value="英文">
                    <span class="custom-checkbox"></span>
                    <span>English</span>
                </label>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <input type="text" id="queryInput" maxlength="50" placeholder="想找什麼書呢？">
                    <span class="char-count" id="charCount">0 / 50</span>
                </div>
                <button class="search-btn" id="searchBtn">AI 找書</button>
            </div>

            <div class="note-container">
                <p>💡 保護隱私：請勿輸入個人資料、機密資訊或其他敏感內容。</p>
                <p>💡 容錯提醒：AI 語意理解偶有偏誤，書籍資訊請以實際內容為準。</p>
                <p>💡 內容來源：部分書籍資訊與內容可能來自網路資料。</p>
                <p class="test_view"></p>
            </div>

            <div class="examples-section">
                <button class="refresh-btn" id="refreshBtn">↻ 換一組</button>
                <div class="tags-container" id="tagsContainer"></div>
            </div>

        </div>

        <div id="errorMsg" class="error-msg"></div>

        <div class="loading-box" id="loadingBox">
            <div class="spinner"></div>正在搜尋最適合的書籍...
        </div>

        <div class="results-grid" id="resultsContainer"></div>
    </div>

    <script>
        /* AI找書 開始 */
        const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyWiENAu6pzdw9CY61H-EGDUelPoK47z5nQkBCt-boN9a1ttgWrbMIcuCAqmy3_Sz9_/exec";

        $(document).ready(function () {
            const rawExamples = [];


            function getRandomExamples(count) {
                let shuffled = rawExamples.slice(0), i = rawExamples.length, min = i - count, temp, index;
                while (i-- > min) {
                    index = Math.floor((i + 1) * Math.random());
                    temp = shuffled[index];
                    shuffled[index] = shuffled[i];
                    shuffled[i] = temp;
                }
                return shuffled.slice(min);
                //全部顯示
                //return rawExamples.slice();
            }

            function renderExamples() {
                const selected = getRandomExamples(8);
                const container = $('#tagsContainer');
                container.empty();
                selected.forEach(text => {
                    container.append(`<div class="example-tag">${text}</div>`);
                });
            }

            function updateCharCount() {
                const val = $('#queryInput').val();
                const len = val.length;
                $('#charCount').text(`${len} / 50`);
                if (len > 50) { $('#charCount').css('color', 'red'); } else { $('#charCount').css('color', '#6B7280'); }
            }

            $('#tagsContainer').on('click', '.example-tag', function () {
                $('#queryInput').val($(this).text());
                updateCharCount();
            });

            $('#refreshBtn').on('click', renderExamples);
            $('#queryInput').on('input', updateCharCount);

            $('#searchBtn').on('click', function () {
                const query = $('#queryInput').val().trim();
                if (!query) { showError('請輸入想要尋找的情境或書籍主題！'); return; }
                if (query.length > 50) { showError('輸入字數不能超過 50 字！'); return; }

                const langCheckbox = $('.lang-checkbox:checked').map(function () {
                    return $(this).val();
                }).get();

                $('#errorMsg').hide();
                $('#resultsContainer').empty();
                $('#loadingBox').show();
                $('#searchBtn').prop('disabled', true).text('搜尋中...');

                $.ajax({
                    url: 'https://artapi.zeabur.app/lb/api/search',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ query: query, lang_checkbox: langCheckbox }),
                    success: function (response) {
                        $('#loadingBox').hide();
                        $('#searchBtn').prop('disabled', false).text('AI 找書');
                        renderResults(response.results, query);
                        //
                        var test_view = '';
                        test_view += "是否使用AI改寫query:" + response.ising_rewrite + "<br>";
                        test_view += "是否使用AI推薦:" + response.ising_llm_msg + "<br>";
                        test_view += "原始查詢:" + response.org_query + "<br>";
                        test_view += "改寫查詢:" + response.query + "<br>";
                        $(".test_view").html(test_view);
                    },
                    error: function (xhr) {
                        $('#loadingBox').hide();
                        $('#searchBtn').prop('disabled', false).text('AI 找書');
                        let errorText = '系統忙碌中或發生錯誤，請稍後再試。';
                        if (xhr.responseJSON && xhr.responseJSON.message) errorText = xhr.responseJSON.message;
                        showError('錯誤：' + errorText);
                    }
                });
            });

            function renderResults(results, currentQuery) {
                if (!results || results.length === 0) {
                    $('#resultsContainer').html('<p style="grid-column: 1/-1; text-align: center; color: #6B7280;">找不到相關書籍，請嘗試其他情境描述。</p>');
                    return;
                }

                const container = $('#resultsContainer');

                results.forEach(item => {
                    let fullTitle = item.title || '未知書名';
                    if (item.other_title) fullTitle += ' ' + item.other_title;
                    if (item.other_title_2) fullTitle += ' ' + item.other_title_2;

                    const authors = item.authors || '未知作者';
                    const isbn = item.isbn || '無 ISBN';
                    const summary = item.summary || '暫無摘要';
                    const lang = item.lang || '未知語言';
                    const score = item.score;
                    const bookId = item.id;
                    const detailUrl = `https://lb30.libraryandbook.net/Book_detial/${bookId}`;
                    const cardHtml = `
                <div class="book-card" data-bookid="${bookId}" data-booktitle="${fullTitle}" data-query="${currentQuery}">
                    <h3 class="book-title"><a href="${detailUrl}">${fullTitle}</a></h3>
                    <div class="book-meta">🏷️作者：${authors}</div>
                    <div class="book-meta">🏷️ISBN：${isbn}</div>
                    <div class="book-meta">🏷️語言別：${lang}</div>
                    <div class="book-meta score">🏷️相關度：${score}</div>
                    <div class="book-summary" title="${summary}">${summary}</div>
                    <a href="${detailUrl}" class="book-link" style="margin-bottom: 10px;">詳細書目</a>
                    
                    <div class="feedback-section">
                        <div class="feedback-buttons">
                            <button class="feedback-btn like-btn">喜歡</button>
                            <button class="feedback-btn dislike-btn">不喜歡</button>
                        </div>
                        
                        <div class="dislike-form">
                            <p>請告訴我們原因：</p>
                            <label><input type="radio" name="reason-${bookId}" value="不符合情境" class="reason-radio"> 不符合情境</label>
                            <label><input type="radio" name="reason-${bookId}" value="與書單資訊不符" class="reason-radio"> 與書單資訊不符</label>
                            <label><input type="radio" name="reason-${bookId}" value="用錯語言" class="reason-radio"> 用錯語言</label>
                            <label><input type="radio" name="reason-${bookId}" value="其他" class="reason-radio"> 其他</label>
                            <input type="text" class="other-input" maxlength="30" placeholder="請輸入其他原因...(限 30 字)">
                            <button class="submit-dislike-btn">送出回饋</button>
                        </div>
                        
                        <div class="feedback-msg">謝謝您的回饋！</div>
                    </div>
                </div>
            `;
                    container.append(cardHtml);


                });
            }

            function showError(msg) {
                $('#errorMsg').text(msg).fadeIn();
                setTimeout(() => { $('#errorMsg').fadeOut(); }, 5000);
            }
            $('#queryInput').on('keypress', function (e) {
                if (e.which === 13) {
                    $('#searchBtn').click();
                }
            });
            loadExamples();


            function sendFeedbackToSheet(card, feedbackType, reason = "", otherReason = "") {
                const payload = {
                    timestamp: new Date().toLocaleString('zh-TW', { hour12: false }),
                    bookId: card.data('bookid'),
                    bookTitle: card.data('booktitle'),
                    queryContext: card.data('query'),
                    feedbackType: feedbackType,
                    reason: reason,
                    otherReason: otherReason
                };

                fetch(GOOGLE_SHEET_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(err => console.error("傳送回饋失敗:", err));
            }

            $(document).on('click', '.like-btn', function () {
                const card = $(this).closest('.book-card');
                const section = $(this).closest('.feedback-section');

                sendFeedbackToSheet(card, '喜歡');
                section.find('.feedback-buttons').hide();
                section.find('.dislike-form').hide();
                section.find('.feedback-msg').fadeIn();
            });

            $(document).on('click', '.dislike-btn', function () {
                const section = $(this).closest('.feedback-section');
                section.find('.feedback-buttons').hide();
                section.find('.dislike-form').fadeIn();
            });

            $(document).on('change', '.reason-radio', function () {
                const form = $(this).closest('.dislike-form');
                if ($(this).val() === '其他') {
                    form.find('.other-input').slideDown();
                } else {
                    form.find('.other-input').slideUp();
                }
            });

            $(document).on('click', '.submit-dislike-btn', function () {
                const card = $(this).closest('.book-card');
                const section = $(this).closest('.feedback-section');
                const form = section.find('.dislike-form');

                const selectedReason = form.find('.reason-radio:checked').val();
                if (!selectedReason) {
                    alert('請選擇一個原因！');
                    return;
                }

                const otherReasonText = selectedReason === '其他' ? form.find('.other-input').val().trim() : "";
                if (selectedReason === '其他' && !otherReasonText) {
                    alert('請輸入其他原因！');
                    return;
                }

                sendFeedbackToSheet(card, '不喜歡', selectedReason, otherReasonText);
                form.hide();
                section.find('.feedback-msg').fadeIn();
            });

            function loadExamples() {
                $.ajax({
                    url: GOOGLE_SHEET_API_URL,
                    method: 'GET',
                    dataType: 'json',
                    success: function (response) {
                        if (response.success && Array.isArray(response.examples)) {
                            rawExamples = response.examples;
                            renderExamples();
                        } else {
                            showError('無法取得情境範例。');
                        }
                    },
                    error: function () {
                        showError('無法連線取得情境範例，請稍後再試。');
                    }
                });
            }

        });
        /* AI找書 結束 */
    </script>
</body>

</html>
